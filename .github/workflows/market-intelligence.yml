name: Market Intelligence

on:
  push:
    branches:
      - main
    paths-ignore:
      - .market_alert_state.json
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

jobs:
  run-market-intelligence:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
      GOLD_API: ${{ secrets.GOLD_API }}
      ITICK_API_KEY: ${{ secrets.ITICK_API_KEY }}
      TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
      ALPHAVANTAGE_API_KEY: ${{ secrets.ALPHAVANTAGE_API_KEY }}
      COIN_GECKO_API: ${{ secrets.COIN_GECKO_API }}
      TELEGRAM_CHAT_ID: ${{ vars.TELEGRAM_CHAT_ID || '843487976' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Record deployed commit and configuration types
        run: |
          git rev-parse HEAD
          git status --short
          python configuration_type_diagnostics.py

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate imports
        run: python import_validation.py

      - name: Compile Python sources
        run: python -m compileall .

      - name: Validate configured secrets
        shell: bash
        run: |
          check_secret() {
            local name="$1"
            if [ -n "${!name:-}" ]; then
              echo "$name: CONFIGURED"
            else
              echo "$name: NOT CONFIGURED"
            fi
          }
          check_secret ALPHAVANTAGE_API_KEY
          check_secret COIN_GECKO_API
          check_secret GOLD_API
          check_secret ITICK_API_KEY
          check_secret TELEGRAM_TOKEN
          check_secret TWELVEDATA_API_KEY
          test -n "$TELEGRAM_TOKEN"
          test -n "$TELEGRAM_CHAT_ID"

      - name: Run tests
        run: python -m pytest -q

      - name: Run deterministic integration harness
        run: python test_system.py

      - name: Run sanitized provider health diagnostics
        run: python github_provider_diagnostics.py --send-telegram

      - name: Run market intelligence
        run: python main.py

      - name: Persist alert memory
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .market_alert_state.json
          git diff --cached --quiet && exit 0
          git commit -m "Persist alert memory [skip ci]"
          git push
